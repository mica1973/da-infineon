  // Server-rendered China e-commerce flag; DOM-independent so it is reliable before body renders.
  const isChinaEcommerce = "false" === "true";
  function getCookie(name) {
    const cookieValue = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return cookieValue ? cookieValue.pop() : '';
  }

  function ifxResolveCurrency() { 
    if (isChinaEcommerce) {
      return '';
    }    
    const activeCurrency = document.documentElement?.getAttribute('data-active-currency')?.trim().toUpperCase();
    const cookieCurrency = (getCookie('MkHcCurrencyId') || '').trim().toUpperCase();
    const localCurrency = (localStorage.getItem('ifxCurrencyId') || '').trim().toUpperCase();
    return  activeCurrency || cookieCurrency || localCurrency || '';
  }

  const correctPageMetaCurrency = (resolvedCurrency) => {
    const pageMeta = window.dataLayer?.find((dataLayerItem) => dataLayerItem.event === 'pageMeta');
    if (!pageMeta?.page?.pageInfo) {
      return;
    }
    // China does not use activeCurrency; force it blank even if already populated.
    if (isChinaEcommerce) {
      if (pageMeta.page.pageInfo.activeCurrency !== '') {
        pageMeta.page.pageInfo.activeCurrency = '';
        window.dataLayer.push({ page: { pageInfo: { activeCurrency: '' } } });
      }
      return;
    }
    if (!resolvedCurrency || pageMeta.page.pageInfo.activeCurrency === resolvedCurrency) {
      return;
    }
    pageMeta.page.pageInfo.activeCurrency = resolvedCurrency;
    window.dataLayer.push({ page: { pageInfo: { activeCurrency: resolvedCurrency } } });
  };

  window.addEventListener('currencyChanged', (event) => {
    const resolvedCurrency = event.detail?.currencyCode;
    if (resolvedCurrency) {
      document.documentElement.setAttribute('data-active-currency', resolvedCurrency);
    }
  });

  new MutationObserver(() => {
    correctPageMetaCurrency(document.documentElement.getAttribute('data-active-currency')?.trim().toUpperCase());
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-active-currency'] });

    const currentPageArr = match ? [match[1]] : [];
    if(currentPageArr){

    }
    return  famArry?.reverse();
}
  const myCookie = getCookie('userObject');

  const decodedString = atob(myCookie);
    try {

  (userinfo) && userinfo.userGroup ? userinfo.userGroup = userGroup : userinfo.userGroup = '';

  else {

  }

    userDetailsForDataLayer.myInfineonUserGroup = userGroup
    userDetailsForDataLayer.userId = userinfoFromCookie.objectGUID
  }

  sessionStorage.removeItem("pageValue");
  sessionStorage.setItem("pageValue",JSON.stringify({"cmsId":cmsId}));
  sessionStorage.removeItem("distiObj");
  if (landingPageType != 'search-template')
    localStorage.removeItem("searchComponent");
